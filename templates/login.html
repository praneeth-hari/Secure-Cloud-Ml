<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>SecureCloudML — Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body {
      background: linear-gradient(135deg, #0d47a1 0%, #1a73e8 50%, #42a5f5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-wrapper {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.18);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
    }
    .login-header {
      background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
      padding: 32px 36px 24px;
      text-align: center;
    }
    .login-header .shield-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 14px;
      background: rgba(255,255,255,0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(255,255,255,0.3);
    }
    .login-header .shield-icon svg { width: 28px; height: 28px; fill: #fff; }
    .login-header h1 {
      color: #fff;
      font-size: 1.1em;
      font-weight: 700;
      line-height: 1.4;
    }
    .login-header p {
      color: rgba(255,255,255,0.78);
      font-size: 0.82em;
      margin-top: 6px;
    }
    .login-body { padding: 32px 36px 36px; }
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      font-size: 0.85em;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #d0ddf0;
      border-radius: 6px;
      font-size: 0.95em;
      color: #2d3748;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    .form-group input:focus {
      border-color: #1a73e8;
      box-shadow: 0 0 0 3px rgba(26,115,232,0.12);
    }
    .login-btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #1a73e8, #0d47a1);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.95em;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: opacity 0.2s, transform 0.15s;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    .login-btn:hover { opacity: 0.90; transform: translateY(-1px); }
    .error-msg {
      background: #fce8e6;
      color: #c62828;
      border-left: 4px solid #e53935;
      border-radius: 4px;
      padding: 10px 14px;
      font-size: 0.88em;
      margin-bottom: 18px;
    }
    .hint-box {
      background: #f0f7ff;
      border: 1px solid #c7ddf7;
      border-radius: 6px;
      padding: 12px 16px;
      margin-top: 20px;
      font-size: 0.82em;
      color: #4a6580;
      text-align: center;
    }
    .hint-box strong { color: #0d47a1; }
    .login-footer {
      text-align: center;
      padding: 14px;
      background: #f8faff;
      border-top: 1px solid #e3eaf3;
      font-size: 0.78em;
      color: #7f8c8d;
    }
  </style>
</head>
<body>

<div class="login-wrapper">

  <div class="login-header">
    <div class="shield-icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
      </svg>
    </div>
    <h1>Enhancing The Data Transmission Security<br>In Cloud Using Machine Learning</h1>
    <p>Sign in to access the dashboard</p>
  </div>

  <div class="login-body">

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter username" required autocomplete="username"/>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password"/>
      </div>
      <button type="submit" class="login-btn">Sign In</button>
    </form>

    <div class="hint-box">
      Use the <strong>API_USERNAME</strong> / <strong>API_PASSWORD</strong> credentials configured in your <code>.env</code> file.
    </div>

  </div>

  <div class="login-footer">
    SecureCloudML &mdash; Data Transmission Security System
  </div>

</div>

</body>
</html>
